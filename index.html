<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    body {

      background: #f8f9fa;

      max-width: 600px;

      padding: 30px;

      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
    }
    .cta {
      margin-top: 25px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: white;

<body>
